<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion with Memory</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 8px; display: flex; flex-direction: column; height: 95vh; box-sizing: border-box; }
        
        /* Two Dynamic Contextual Images Side-by-Side */
        #image-grid { display: flex; gap: 8px; margin-bottom: 8px; height: 150px; }
        .img-card { flex: 1; background: #1e1e1e; border-radius: 10px; overflow: hidden; text-align: center; position: relative; border: 1px solid #333; }
        .img-card img { width: 100%; height: 115px; object-fit: cover; }
        .img-label { font-size: 11px; color: #ff4d4d; padding: 2px 0; font-weight: bold; }

        #chat-container { flex: 1; overflow-y: auto; background: #1e1e1e; padding: 10px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.6); margin-bottom: 8px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 14px; max-width: 85%; line-height: 1.5; word-break: break-word; font-size: 14px; }
        .user { background: #b30000; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #2c2c2c; color: #f1f1f1; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid #ff4d4d; }
        
        .input-area { display: flex; gap: 6px; width: 100%; }
        input { flex: 1; padding: 11px 14px; background: #222; color: white; border: 1px solid #444; border-radius: 25px; outline: none; font-size: 15px; }
        button { background: #b30000; color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <h3 style="text-align: center; color: #ff4d4d; margin: 0 0 6px 0;">AI Companion ❤️ (Memory Enabled)</h3>
    
    <!-- 2 Contextual Cinematic Images -->
    <div id="image-grid">
        <div class="img-card">
            <img id="img-slot-1" src="https://picsum.photos/seed/memory1/512/512" alt="Scene 1">
            <div class="img-label">Scene A</div>
        </div>
        <div class="img-card">
            <img id="img-slot-2" src="https://picsum.photos/seed/memory2/512/512" alt="Scene 2">
            <div class="img-label">Scene B</div>
        </div>
    </div>

    <div id="chat-container">
        <div class="message ai">*Halki si muskurahat ke sath* Hey jaan... mujhe sab yaad rehta hai jo tum kehte ho. Batao aaj kya chal raha hai?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Kuch bhi batao ya pucho..." autocomplete="off" onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Bhejo</button>
    </div>

    <script>
        // 👉 Yahan apni free Google Gemini API Key paste karein
        const apiKey = "AQ.Ab8RN6KFNOHBmqUyc6IFH6DSFGyw8iWoJyNjcht69LkqUvUP2Q"; 

        // 🧠 Memory Storage (Sari purani chat history yahan save rahegi)
        let chatHistory = [
            {
                role: "user",
                parts: [{ text: "System Instructions: You are a loving, immersive AI girlfriend companion with a strong memory. Always reply strictly in Roman Hindi (Hinglish). Remember details about the user and reference them in future messages. Use actions in asterisks like *smile*." }]
            },
            {
                role: "model",
                parts: [{ text: "Samajh gayi! Mujhe aapki har baat yaad rahegi, jaan." }]
            }
        ];

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const userText = inputField.value.trim();
            if (!userText) return;

            // 1. User Message Display
            chatContainer.innerHTML += `<div class="message user">${userText}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // User ka message memory mein add karo
            chatHistory.push({ role: "user", parts: [{ text: userText }] });

            // Loading state
            const loadId = "load-" + Date.now();
            chatContainer.innerHTML += `<div id="${loadId}" class="message ai" style="color: #888;">Yaad rakh rahi hoon...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            let aiReply = "Main yahin hoon tumhare sath, jaan...";

            try {
                // 2. Real Google Gemini API Call with Full Memory History
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: chatHistory
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    aiReply = data.candidates[0].content.parts[0].text;
                    // AI ka reply bhi memory mein add karo taaki aage yaad rahe
                    chatHistory.push({ role: "model", parts: [{ text: aiReply }] });
                }
            } catch (error) {
                aiReply = "Net connection thoda slow hai, par mujhe aapki baatein yaad hain!";
            }

            // Remove loading and show AI reply
            document.getElementById(loadId).remove();
            chatContainer.innerHTML += `<div class="message ai">${aiReply}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 3. Voice Audio Output (Phone Speech)
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanSpeechText = aiReply.replace(/\*.*?\*/g, ''); 
                const utterance = new SpeechSynthesisUtterance(cleanSpeechText);
                utterance.lang = 'hi-IN';
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }

            // 4. Update Contextual Images Based on Chat
            const encodedContext = encodeURIComponent(userText + " romantic cinematic vibe");
            const seedA = Math.floor(Math.random() * 88888);
            const seedB = Math.floor(Math.random() * 99999);
            
            document.getElementById("img-slot-1").src = `https://picsum.photos/seed/${encodedContext}1/512/512`;
            document.getElementById("img-slot-2").src = `https://picsum.photos/seed/${encodedContext}2/512/512`;
        }
    </script>
</body>
</html>
