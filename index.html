<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion Gemini Smart Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 8px; display: flex; flex-direction: column; height: 95vh; box-sizing: border-box; }
        
        /* Two Image Layout Side-by-Side */
        #image-grid { display: flex; gap: 8px; margin-bottom: 8px; height: 140px; }
        .img-card { flex: 1; background: #2a2a2a; border-radius: 10px; overflow: hidden; text-align: center; position: relative; border: 1px solid #444; }
        .img-card img { width: 100%; height: 105px; object-fit: cover; }
        .img-label { font-size: 11px; color: #aaa; padding: 2px 0; }

        #chat-container { flex: 1; overflow-y: auto; background: #2a2a2a; padding: 10px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 12px; max-width: 85%; line-height: 1.4; word-break: break-word; font-size: 14px; }
        .user { background: #b30000; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #3a3a3a; color: #ddd; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .input-area { display: flex; gap: 6px; width: 100%; }
        input { flex: 1; padding: 10px 14px; background: #333; color: white; border: 1px solid #555; border-radius: 25px; outline: none; font-size: 15px; }
        button { background: #b30000; color: white; border: none; padding: 0 18px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <h3 style="text-align: center; color: #ff4d4d; margin: 0 0 6px 0;">AI Companion ❤️ (Gemini Live)</h3>
    
    <!-- 2 Cinematic Image Slots -->
    <div id="image-grid">
        <div class="img-card">
            <img id="img-slot-1" src="https://picsum.photos/seed/scene1/512/512" alt="Scene 1">
            <div class="img-label">Scene A</div>
        </div>
        <div class="img-card">
            <img id="img-slot-2" src="https://picsum.photos/seed/scene2/512/512" alt="Scene 2">
            <div class="img-label">Scene B</div>
        </div>
    </div>

    <div id="chat-container">
        <div class="message ai">Hey jaan! Main live ho gayi hoon. Ab batao kya baat karni hai?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Kuch bhi pucho..." autocomplete="off" onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Bhejo</button>
    </div>

    <script>
        // 👉 APNI GEMINI API KEY YAHAN PASTE KAREIN (Quotes ke andar)
        const apiKey = "AQ.Ab8RN6LNJkoNUlZWvilCe-JFAWS0Q9IpLvBQphOC_00ItlFMwg"; 

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const userText = inputField.value.trim();
            if (!userText) return;

            // 1. User Message Display
            chatContainer.innerHTML += `<div class="message user">${userText}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading state
            const loadingId = "load-" + Date.now();
            chatContainer.innerHTML += `<div id="${loadingId}" class="message ai" style="color: #888;">Soch rahi hoon...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            let aiReply = "Kuch technical problem aa gayi hai, par main yahin hoon!";

            try {
                // 2. Real Google Gemini API Call
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [
                            { 
                                role: "user", 
                                parts: [{ 
                                    text: "You are a loving, romantic, and warm AI girlfriend companion. Always reply naturally and directly to the user's message strictly in Roman Hindi (Hinglish). Keep responses engaging and conversational based on what the user says. User message: " + userText 
                                }] 
                            }
                        ]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    aiReply = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    aiReply = "API Key galat lag rahi hai, please check karo!";
                }
            } catch (error) {
                aiReply = "Net connection check karo, message nahi gaya.";
            }

            // Remove loading text and show real AI reply
            document.getElementById(loadingId).remove();
            chatContainer.innerHTML += `<div class="message ai">${aiReply}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 3. Voice Audio Output (Phone Speech)
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(aiReply);
                utterance.lang = 'hi-IN';
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }

            // 4. Update 2 Cinematic Images Instantly
            const randomId1 = Math.floor(Math.random() * 50000);
            const randomId2 = Math.floor(Math.random() * 50000);
            
            document.getElementById("img-slot-1").src = `https://picsum.photos/seed/${randomId1}/512/512`;
            document.getElementById("img-slot-2").src = `https://picsum.photos/seed/${randomId2}/512/512`;
        }
    </script>
</body>
</html>
