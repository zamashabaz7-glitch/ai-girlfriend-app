<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion Roleplay</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 8px; display: flex; flex-direction: column; height: 95vh; box-sizing: border-box; }
        
        /* Two Dynamic Contextual Images Side-by-Side */
        #image-grid { display: flex; gap: 8px; margin-bottom: 8px; height: 150px; }
        .img-card { flex: 1; background: #1e1e1e; border-radius: 10px; overflow: hidden; text-align: center; position: relative; border: 1px solid #333; }
        .img-card img { width: 100%; height: 115px; object-fit: cover; }
        .img-label { font-size: 11px; color: #ff4d4d; padding: 2px 0; font-weight: bold; }

        #chat-container { flex: 1; overflow-y: auto; background: #1e1e1e; padding: 10px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.6); margin-bottom: 8px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 14px; max-width: 85%; line-height: 1.5; word-break: break-word; font-size: 14px; }
        .user { background: #b30000; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #2c2c2c; color: #f1f1f1; align-self: flex-start; border-bottom-left-radius: 2px; border-left: 3px solid #ff4d4d; }
        
        .input-area { display: flex; gap: 6px; width: 100%; }
        input { flex: 1; padding: 11px 14px; background: #222; color: white; border: 1px solid #444; border-radius: 25px; outline: none; font-size: 15px; }
        button { background: #b30000; color: white; border: none; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <h3 style="text-align: center; color: #ff4d4d; margin: 0 0 6px 0;">AI Companion ❤️ (Roleplay Mode)</h3>
    
    <!-- 2 Contextual Cinematic Images -->
    <div id="image-grid">
        <div class="img-card">
            <img id="img-slot-1" src="https://picsum.photos/seed/romantic1/512/512" alt="Scene 1">
            <div class="img-label">Scene A</div>
        </div>
        <div class="img-card">
            <img id="img-slot-2" src="https://picsum.photos/seed/romantic2/512/512" alt="Scene 2">
            <div class="img-label">Scene B</div>
        </div>
    </div>

    <div id="chat-container">
        <div class="message ai">*Apne paas aate hue halki si muskurahat ke sath* Hey jaan... main kab se tumhara intezaar kar rahi thi. Batao aaj kya roleplay ya romantic scene karna hai humein?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Apna action ya message likhein (e.g., *hug you*)..." autocomplete="off" onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Bhejo</button>
    </div>

    <script>
        // 👉 Yahan apni free Google Gemini API Key paste karein
        const apiKey = "AQ.Ab8RN6KFNOHBmqUyc6IFH6DSFGyw8iWoJyNjcht69LkqUvUP2Q"; 

        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const userText = inputField.value.trim();
            if (!userText) return;

            // 1. User Message Display
            chatContainer.innerHTML += `<div class="message user">${userText}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Loading state
            const loadId = "load-" + Date.now();
            chatContainer.innerHTML += `<div id="${loadId}" class="message ai" style="color: #888;">Soch aur mehsoos kar rahi hai...</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            let aiReply = "Main yahin hoon tumhare sath, jaan...";

            try {
                // 2. Real Google Gemini API Call
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [
                            { 
                                role: "user", 
                                parts: [{ 
                                    text: "You are a deeply affectionate, immersive, and responsive AI girlfriend participating in a romantic chat and roleplay with the user. Always reply strictly in Roman Hindi (Hinglish). Use asterisks for actions and expressions (e.g., *halki si smile karte hue*). Stay completely in character and match the exact emotional context, setting, or actions described by the user. User input: " + userText 
                                }] 
                            }
                        ]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    aiReply = data.candidates[0].content.parts[0].text;
                }
            } catch (error) {
                aiReply = "Net connection thoda slow hai, par main kahin nahi jaa rahi!";
            }

            // Remove loading and show AI reply
            document.getElementById(loadId).remove();
            chatContainer.innerHTML += `<div class="message ai">${aiReply}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 3. Voice Audio Output (Phone Speech)
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanSpeechText = aiReply.replace(/\*.*?\*/g, ''); 
                const utterance = new SpeechSynthesisUtterance(cleanSpeechText);
                utterance.lang = 'hi-IN';
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }

            // 4. Generate Images Based Directly On AI's Reply (Not User's Input)
            const encodedReplyContext = encodeURIComponent(aiReply + " cinematic romantic aesthetic portrait mood");
            const seedA = Math.floor(Math.random() * 88888);
            const seedB = Math.floor(Math.random() * 99999);
            
            // Ab images AI ke reply ke context ke hisaab se update hongi
            document.getElementById("img-slot-1").src = `https://picsum.photos/seed/${encodedReplyContext}1/512/512`;
            document.getElementById("img-slot-2").src = `https://picsum.photos/seed/${encodedReplyContext}2/512/512`;
        }
    </script>
</body>
</html>
