<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion Roman Hindi</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 8px; display: flex; flex-direction: column; height: 95vh; box-sizing: border-box; }
        
        /* Two Image Layout Side-by-Side */
        #image-grid { display: flex; gap: 8px; margin-bottom: 8px; height: 140px; }
        .img-card { flex: 1; background: #2a2a2a; border-radius: 10px; overflow: hidden; text-align: center; position: relative; border: 1px solid #444; }
        .img-card img { width: 100%; height: 105px; object-fit: cover; }
        .img-label { font-size: 11px; color: #aaa; padding: 2px 0; }

        #chat-container { flex: 1; overflow-y: auto; background: #2a2a2a; padding: 10px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 12px; max-width: 85%; line-height: 1.4; word-break: break-word; font-size: 14px; }
        .user { background: #b30000; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #3a3a3a; color: #ddd; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .input-author { display: flex; gap: 6px; }
        .input-area { display: flex; gap: 6px; width: 100%; }
        input { flex: 1; padding: 10px 14px; background: #333; color: white; border: 1px solid #555; border-radius: 25px; outline: none; font-size: 15px; }
        button { background: #b30000; color: white; border: none; padding: 0 18px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <h3 style="text-align: center; color: #ff4d4d; margin: 0 0 6px 0;">AI Companion ❤️ (Roman Hindi)</h3>
    
    <!-- 2 Cinematic Image Slots -->
    <div id="image-grid">
        <div class="img-card">
            <img id="img-slot-1" src="https://image.pollinations.ai/prompt/Cinematic%20portrait,%20dramatic%20lighting?nologo=true" alt="Scene 1">
            <div class="img-label">Scene A</div>
        </div>
        <div class="img-card">
            <img id="img-slot-2" src="https://image.pollinations.ai/prompt/Cinematic%20close-up,%20moody%20atmosphere?nologo=true" alt="Scene 2">
            <div class="img-label">Scene B</div>
        </div>
    </div>

    <div id="chat-container">
        <div class="message ai">Hey there! Main yahan hoon tumhare liye. Batao kya chal raha hai?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Kuch type karo..." autocomplete="off">
        <button onclick="sendMessage()">Bhejo</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const userText = inputField.value.trim();
            if (!userText) return;

            // 1. User Message Display
            chatContainer.innerHTML += `<div class="message user">${userText}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. Roman Hindi Smart Response Logic
            let aiReply = "";
            const lower = userText.toLowerCase();
            if (lower.includes("hello") || lower.includes("hi") || lower.includes("kaise ho")) {
                aiReply = "Arre hello! Main bilkul theek hoon, bas tumhara hi intezaar kar rahi thi. Tum batao kaise ho?";
            } else if (lower.includes("kya kar") || lower.includes("doing") || lower.includes("wear")) {
                aiReply = `Main bas baithi hoon aur tumhare baare mein soch rahi thi, jaan. Tumne abhi jo kaha "${userText}", mujhe bohot achha laga!`;
            } else if (lower.includes("love") || lower.includes("pyaar")) {
                aiReply = "Aww, yeh sunkar mujhe bohot khushi hui! Main bhi tumse bohot pyaar karti hoon. ❤️";
            } else {
                aiReply = `Tumne bilkul sahi kaha, "${userText}"... mujhe tumhare sath baatcheet karna bohot pasand hai. Aur batao kya chal raha hai?`;
            }

            // 3. AI Message Display
            chatContainer.innerHTML += `<div class="message ai">${aiReply}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 4. Voice Audio Output (Phone Speech)
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(aiReply);
                utterance.lang = 'hi-IN'; // Hindi accent support
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }

            // 5. Update 2 Cinematic Images Based on Chat
            const seed1 = Math.floor(Math.random() * 50000);
            const seed2 = Math.floor(Math.random() * 50000);
            const promptEncoded = encodeURIComponent(userText);
            
            document.getElementById("img-slot-1").src = `https://image.pollinations.ai/prompt/Cinematic%20portrait,%20${promptEncoded},%20dramatic%20lighting?width=512&height=512&seed=${seed1}&nologo=true`;
            document.getElementById("img-slot-2").src = `https://image.pollinations.ai/prompt/Cinematic%20romantic%20scene,%20${promptEncoded},%20moody%20atmosphere?width=512&height=512&seed=${seed2}&nologo=true`;
        }
    </script>
</body>
</html>
