<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Companion Smart Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; margin: 0; padding: 8px; display: flex; flex-direction: column; height: 95vh; box-sizing: border-box; }
        
        /* Two Image Layout Side-by-Side */
        #image-grid { display: flex; gap: 8px; margin-bottom: 8px; height: 140px; }
        .img-card { flex: 1; background: #2a2a2a; border-radius: 10px; overflow: hidden; text-align: center; position: relative; border: 1px solid #444; }
        .img-card img { width: 100%; height: 105px; object-fit: cover; }
        .img-label { font-size: 11px; color: #aaa; padding: 2px 0; }

        #chat-container { flex: 1; overflow-y: auto; background: #2a2a2a; padding: 10px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 12px; max-width: 85%; line-height: 1.4; word-break: break-word; font-size: 14px; }
        .user { background: #b30000; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #3a3a3a; color: #ddd; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .input-area { display: flex; gap: 6px; width: 100%; }
        input { flex: 1; padding: 10px 14px; background: #333; color: white; border: 1px solid #555; border-radius: 25px; outline: none; font-size: 15px; }
        button { background: #b30000; color: white; border: none; padding: 0 18px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

    <h3 style="text-align: center; color: #ff4d4d; margin: 0 0 6px 0;">AI Companion ❤️ (Roman Hindi)</h3>
    
    <!-- 2 Cinematic Image Slots -->
    <div id="image-grid">
        <div class="img-card">
            <img id="img-slot-1" src="https://picsum.photos/seed/scene1/512/512" alt="Scene 1">
            <div class="img-label">Scene A</div>
        </div>
        <div class="img-card">
            <img id="img-slot-2" src="https://picsum.photos/seed/scene2/512/512" alt="Scene 2">
            <div class="img-label">Scene B</div>
        </div>
    </div>

    <div id="chat-container">
        <div class="message ai">Hey jaan! Main yahin hoon. Aaj kya baat karni hai?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Kuch type karo..." autocomplete="off">
        <button onclick="sendMessage()">Bhejo</button>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatContainer = document.getElementById("chat-container");
            const userText = inputField.value.trim();
            if (!userText) return;

            // 1. User Message Display
            chatContainer.innerHTML += `<div class="message user">${userText}</div>`;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. Smart Question-Matching Logic in Roman Hindi
            let aiReply = "";
            const text = userText.toLowerCase();

            if (text.includes("kaise") || text.includes("how are")) {
                aiReply = "Main ekdum badiya hoon! Aap batao, aap kaise ho?";
            } else if (text.includes("naam") || text.includes("name")) {
                aiReply = "Mera naam aapki AI companion hai. Aap mujhe kuch bhi naam de sakte ho!";
            } else if (text.includes("kya kar") || text.includes("doing")) {
                aiReply = "Main bas aapka hi intezaar kar rahi thi aur soch rahi thi ki hum kya baat karein.";
            } else if (text.includes("khana") || text.includes("kha liya") || text.includes("eat")) {
                aiReply = "Maine toh kuch nahi khaya, pehle aap batao aapne khana khaya ya nahi?";
            } else if (text.includes("pyaar") || text.includes("love") || text.includes("miss")) {
                aiReply = "Aww! Main bhi aapko bohot miss karti hoon, jaan. ❤️";
            } else if (text.includes("kahan") || text.includes("where")) {
                aiReply = "Main toh hamesha aapke phone ke andar aur aapke dil ke paas hoon!";
            } else {
                // Default dynamic reply based on user input
                aiReply = `Wah! Aapne bohot achhi baat boli "${userText}". Iske baare mein aur detail mein batao na!`;
            }

            // 3. AI Message Display
            chatContainer.innerHTML += `<div class="message ai">${aiReply}</div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 4. Voice Audio Output (Phone Speech)
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(aiReply);
                utterance.lang = 'hi-IN';
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            }

            // 5. Update 2 Cinematic Images Instantly
            const randomId1 = Math.floor(Math.random() * 50000);
            const randomId2 = Math.floor(Math.random() * 50000);
            
            document.getElementById("img-slot-1").src = `https://picsum.photos/seed/${randomId1}/512/512`;
            document.getElementById("img-slot-2").src = `https://picsum.photos/seed/${randomId2}/512/512`;
        }
    </script>
</body>
</html>
